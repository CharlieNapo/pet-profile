services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petprofile
      POSTGRES_PASSWORD: petprofile
      POSTGRES_DB: petprofile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petprofile -d petprofile"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://petprofile:petprofile@db:5432/petprofile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
