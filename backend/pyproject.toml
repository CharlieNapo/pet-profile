[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "pet-profile-backend"
version = "0.1.0"
description = "Pet Profile API — internal pet insurance profile service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.28,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[tool.uv]
# Keep in step with the uv image tag in backend/Dockerfile.
required-version = "==0.13.7"
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "idna>=3.15",
    "mako>=1.3.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
